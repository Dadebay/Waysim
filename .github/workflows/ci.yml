name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # Formatting, lints and the whole test suite (unit, widget, golden-free).
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # repo.maven.apache.org currently redirects the Kotlin compiler JAR to
      # GitHub, where hosted runners receive HTTP 504. This is the same Maven
      # Central artifact through its alternate hostname, on CI only.
      - name: Use Maven Central alternate hostname on CI
        run: |
          flutter_root="$(dirname "$(dirname "$(command -v flutter)")")"
          sed -i 's#mavenCentral()#maven { url = uri("https://repo1.maven.org/maven2") }#g' android/settings.gradle.kts
          sed -i 's#mavenCentral()#maven { url = uri("https://repo1.maven.org/maven2") }#g' "$flutter_root/packages/flutter_tools/gradle/settings.gradle.kts"
      - run: flutter build apk --debug --dart-define=USE_MOCK_API=true

  ios:
    name: Build iOS
    needs: test
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build ios --debug --no-codesign --dart-define=USE_MOCK_API=true

  # Releases (TestFlight, Google Play internal testing) are a manual, signed
  # step once the Apple and Google accounts exist.
