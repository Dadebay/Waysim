name: waysim
description: "Waysim — travel eSIM reseller app (iOS & Android)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---------------------------------------------------------------- state --
  # Same stack as elyeter: BLoC/Cubit for feature state, equatable for
  # value-equality, hydrated_bloc persists theme + locale across launches.
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  hydrated_bloc: ^11.0.0

  # ------------------------------------------------- dependency injection --
  get_it: ^9.2.1

  # ------------------------------------------------------------ navigation --
  go_router: ^17.5.0

  # --------------------------------------------------------------- network --
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # --------------------------------------------------------------- storage --
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6

  # ---------------------------------------------------------- localization --
  intl: ^0.20.2

  # -------------------------------------------------------------------- ui --
  cupertino_icons: ^1.0.8
  hugeicons: ^1.1.7
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0

  # ------------------------------------------------------- waysim-specific --
  # eSIM QR code + crypto-invoice QR.
  qr_flutter: ^4.1.0
  # iOS model identifier -> eSIM compatibility; "My devices" row.
  device_info_plus: ^13.3.0
  # "About" screen version string.
  package_info_plus: ^10.0.0
  # Idempotency keys for orders and top-ups.
  uuid: ^4.5.1

  # ------------------------------------------------------------- utilities --
  logger: ^2.8.0

  # Support e-mail, PayPal in-app browser, legal documents, one-tap eSIM
  # install on iOS 17.4+ (Apple universal link).
  url_launcher: ^6.3.2

  # System share sheet for the referral link.
  share_plus: ^13.3.0

  # Firebase project "waysim" (lib/firebase_options.dart is generated by
  # `flutterfire configure`): push, crash reports, App Check. Each is wrapped
  # behind an interface in lib/core/services and degrades to a no-op when
  # Firebase is not initialised (tests, builds without the config files).
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.3.0
  firebase_app_check: ^0.4.2
  firebase_analytics: ^12.4.5
  # Crash reports are also written here (who, which phone, which error) so
  # they can be read and fixed without a Crashlytics account.
  cloud_firestore: ^6.3.0
  # An app that is open receives a push but the system draws nothing for it
  # on Android; this draws the banner by hand.
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  # Generates lib/l10n/app_localizations.dart from lib/l10n/arb/*.arb
  # (config lives in l10n.yaml at the project root).
  generate: true

  assets:
    - assets/brand/
    - assets/flags/

  fonts:
    # Gilroy for everything (headings and text). Static cuts with full
    # Cyrillic and Latin; Chinese falls back to the system CJK face — see
    # AppTypography.
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
          weight: 400
        - asset: assets/fonts/Gilroy-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gilroy-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Gilroy-Bold.ttf
          weight: 700

# Launch screen, generated into the native projects:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/brand/splash_logo.png
  color_dark: "#0E121A"
  image_dark: assets/brand/splash_logo_dark.png
  android_12:
    color: "#FFFFFF"
    image: assets/brand/android12_splash.png
    color_dark: "#0E121A"
    image_dark: assets/brand/android12_splash_dark.png
  fullscreen: false
  ios: true
  android: true
  web: false
